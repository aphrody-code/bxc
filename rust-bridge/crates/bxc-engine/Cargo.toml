[package]
name = "bxc-engine"
version.workspace = true
edition.workspace = true
# Deux [[bin]] sans default-run : `cargo run -p bxc-engine` echoue en
# « no bin target named `bxc-engine` in default-run packages », ce qui rend
# `bxc chrome fetch` et `bxc chrome launch` inutilisables des que le binaire
# n'est pas deja construit. Mesure du 2026-09-05.
default-run = "bxc-engine"

[[bin]]
name = "bxc-engine"
path = "src/main.rs"

[[bin]]
name = "obscura-worker"
path = "src/worker.rs"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth", "obscura-mcp/stealth"]

[dependencies]
obscura-browser = { workspace = true }
obscura-mcp = { workspace = true }
obscura-cdp = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
